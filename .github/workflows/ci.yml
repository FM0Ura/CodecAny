name: ci

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  quality-gate:
    name: Quality Gate (lint + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: go vet
        run: go vet ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          args: --timeout=5m
      - name: Tests unitários (mocks)
        run: go test ./... -count=1

  cross-compile:
    name: Cross-compile (${{ matrix.target }})
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Build (CGO_ENABLED=0, binário estático)
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w" -o /tmp/codecany/bin/codecany ./cmd/cli
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: codecany-${{ matrix.goos }}-${{ matrix.goarch }}
          path: /tmp/codecany/bin/codecany

  release:
    name: Release (SemVer)
    needs: cross-compile
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publicar release via softprops
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*/*
          generate_release_notes: true