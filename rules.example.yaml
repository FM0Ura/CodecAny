# CodecAny Rules — exemplo de configuração
# A primeira regra que casar vence (first-match wins).
# Regras mais específicas devem vir antes das genéricas.

version: 1

# ----------------------------------------------------------
# Configuração global
# ----------------------------------------------------------
global:
  default_driver: ffmpeg
  staging_dir: .codecany_tmp/        # pasta de trabalho interna (zero-residue)

  # Política de eficiência de espaço (RF05): aplica rollback se o convertido
  # economizar MENOS que o limite abaixo.
  space_saving:
    min_saving_pct: 15
    fallback_action: rollback

  # hwaccel_limits (v1.2): limita quantas transcodificações usando um dado
  # vendor de hwaccel podem rodar simultaneamente, independente do número de
  # -workers configurado — evita estourar sessões simultâneas de hardware
  # (ex.: GPUs consumer tipicamente limitam sessões NVENC a 2-3). A chave
  # deve ser EXATAMENTE o mesmo valor literal usado em `convert.video.hwaccel`
  # (ou `defaults.video.hwaccel`) nas regras abaixo — sem normalização de
  # alias (ex.: "nvenc" e "cuda" são chaves distintas). Vendors ausentes deste
  # bloco (ou regras sem `hwaccel`) não são limitados, seguem só -workers.
  # hwaccel_limits:
  #   nvenc: 2
  #   vaapi: 1

  # Defaults aplicados quando a regra não os especificar.
  defaults:
    video:
      codec: av1
      crf: 28
      preset: 5
    audio:
      codec: flac
    container: auto

    # auto_approve (v1.2): controla se o Job pode substituir o arquivo
    # original automaticamente assim que a verificação de integridade passar,
    # ou se deve pausar em AWAITING_APPROVAL aguardando aprovação manual
    # (prompt y/N no terminal, ou `-approve <id>`/`-approve-all` depois via
    # `-list-staged`). Sem esta chave definida (nem aqui nem em `auto_approve`
    # dentro de uma regra específica), o default é `false` — toda conversão
    # exige aprovação manual antes de trocar o arquivo original.
    #
    # Para restaurar o comportamento anterior à v1.2 (substituição automática,
    # sem pausa), descomente a linha abaixo:
    # auto_approve: true

# Cada regra também pode sobrepor este default individualmente com
# `auto_approve: true|false` no mesmo nível de `match`/`convert` (fora de
# `convert:`), por exemplo para exigir aprovação só em conversões arriscadas
# (ex.: lossy agressivo) e liberar auto_approve para as demais.

# ----------------------------------------------------------
# Regras (ordem importa: específica primeiro)
# ----------------------------------------------------------
rules:
  # 1) H.264/MJPEG em MKV → AV1
  - name: "MKV H264/MJPEG para AV1"
    match:
      container: mkv
      video:
        codec: [h264, mjpeg] # aceita H.264 ou MJPEG (como webcams antigas ou capas)
      audio:
        codec: [aac, ac3]    # não impeditivo: áudio divergente não bloqueia
    convert:
      video:
        codec: av1
        preset: 5
      audio:
        codec: flac          # converte lossless pesados para FLAC, copia formatos leves
      container: mkv

  # 2) Vídeo AV1 → nunca converter
  - name: "Não mexer em AV1"
    match:
      video:
        codec: av1
    action: skip

  # 3) Fallback genérico: qualquer MP4 H.264/MJPEG → AV1
  - name: "MP4 H264/MJPEG para AV1"
    match:
      container: mp4
      video:
        codec: [h264, mjpeg]
    convert:
      video:
        codec: av1
        preset: 5
      audio:
        codec: flac          # converte lossless pesados para FLAC, copia formatos leves
      container: mkv         # MKV é melhor para preservar legendas e metadados sem perdas

# ----------------------------------------------------------
# Ignora (nunca processa, mesmo que uma regra case)
# ----------------------------------------------------------
ignore:
  dir_contains: ["backup", "downloads_incomplete"]
  file_suffix: [".part", ".download", ".crdownload"]
  min_size_bytes: 1048576    # ignora arquivos < 1MB